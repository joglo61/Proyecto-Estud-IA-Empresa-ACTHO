<!doctype html>
<html lang="es" data-protegida><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tableros · ACTHO</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js"></script>
<style>
.wrap{max-width:1240px}.hero{padding-bottom:64px}.t{position:relative;z-index:1;padding:6px 32px 0}.t h1{font-size:34px;line-height:1.15;margin:0 0 8px;letter-spacing:-.4px}.t h1 b{color:var(--c)}.t p{margin:0;color:#E6DAFB;font-size:14px}
.nav a.s{color:#fff;font-size:13px;font-weight:600;text-decoration:none}
.cg{background:rgba(255,255,255,.16);border-radius:99px;padding:5px 13px;font-weight:600;color:#fff;font-size:13px;margin-right:14px}
.m{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;margin-top:-38px;position:relative;z-index:2;padding-bottom:0}
.pn{flex:1 1 400px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 10px 26px rgba(81,0,187,.10);animation:up .7s cubic-bezier(.2,.7,.2,1) .1s backwards}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.ph b{font-size:19px;color:var(--v)}
.ph span{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--verde)}.ph i{width:9px;height:9px;border-radius:50%;background:var(--verde);animation:pg 1.6s ease-out infinite}
.al{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;text-decoration:none;color:inherit;margin-bottom:10px;transition:background .2s,transform .2s;animation:inl .7s cubic-bezier(.2,.7,.2,1) backwards}
.al:hover{background:#F4EEFD;transform:translateX(3px)}
.al .dt{flex:none;width:12px;height:12px;border-radius:50%}.al .dt.r{animation:pr 1.6s ease-out infinite}
.al .nm{flex:none;min-width:58px;font-size:26px;font-weight:700}
.al .tx{flex:1;min-width:0}.al .tx b{display:block;font-size:14px;font-weight:600;color:var(--ink)}.al .tx small{display:block;font-size:12px;color:var(--mut)}
.al .go{flex:none;font-size:12px;font-weight:700;color:var(--v);background:#F0E9FC;border-radius:99px;padding:6px 12px;white-space:nowrap}
.tl{flex:2 1 560px;display:flex;flex-wrap:wrap;gap:16px}
.mt{flex:1 1 240px;display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;text-decoration:none;color:inherit;transition:transform .25s,box-shadow .25s;animation:up .7s cubic-bezier(.2,.7,.2,1) backwards}
.mt:hover{transform:translateY(-5px);box-shadow:0 16px 34px rgba(81,0,187,.16)}
.mt .h{display:flex;justify-content:space-between;align-items:baseline}.mt .h b{font-size:17px;color:var(--v)}.mt .h span{font-size:12px;font-weight:700;color:var(--o)}.mt .h span i{display:inline-block;font-style:normal;transition:transform .25s}.mt:hover .h span i{transform:translateX(5px)}
.mt .d{font-size:12.5px;color:var(--mut);line-height:1.45}.mt .v{min-height:70px;display:flex;flex-direction:column;justify-content:center;align-items:stretch}.mt .v>*{width:100%}
.mt .s{display:flex;align-items:baseline;gap:8px}.mt .s strong{font-size:24px}.mt .s small{font-size:12px;color:var(--mut)}
.br{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);margin:6px 0}.br span{width:84px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.br div{flex:1;height:9px;background:var(--bg);border-radius:9px;overflow:hidden}.br div i{display:block;height:100%;border-radius:9px;transform-origin:left;animation:gx 1.1s cubic-bezier(.2,.7,.2,1) .5s backwards}
.cl{display:flex;align-items:flex-end;gap:4px;height:70px}.cl i{flex:1;border-radius:4px 4px 0 0;transform-origin:bottom;animation:gy .9s cubic-bezier(.2,.7,.2,1) .5s backwards}
.dd{display:flex;align-items:center;gap:16px}.dd svg circle{animation:dn 1.3s cubic-bezier(.2,.7,.2,1) .5s backwards}
.lg{font-size:12px;color:var(--mut);line-height:1.9}.lg b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.ex{padding-bottom:40px}
.bn{margin-top:20px;background:var(--v);border-radius:26px;padding:26px 24px;color:#fff;position:relative;overflow:hidden;animation:up .7s cubic-bezier(.2,.7,.2,1) .5s backwards}
.bn:before{content:"";position:absolute;right:-70px;top:-80px;width:230px;height:230px;border-radius:50%;border:30px solid rgba(255,85,0,.5);animation:fl 6s ease-in-out infinite}
.bn h3{position:relative;margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--c)}
.bn .nn{position:relative;display:flex;flex-wrap:wrap;gap:8px}.bn .nn div{flex:1 1 200px;text-align:center;padding:8px 10px}
.bn .nn strong{display:block;font-size:44px;line-height:1.1}.bn .nn b{display:block;font-size:13px;font-weight:600;margin-top:4px}.bn .nn small{font-size:12px;color:#E3D6FA}
.gd{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;animation:up .7s cubic-bezier(.2,.7,.2,1) .6s backwards}
.gd>b{display:block;font-size:18px;color:var(--v);margin-bottom:12px}.gd .ps{display:flex;flex-wrap:wrap;gap:18px}
.gd .p{flex:1 1 240px;display:flex;gap:14px;align-items:flex-start}.gd .p i{flex:none;width:14px;height:14px;border-radius:50%;margin-top:4px}
.gd .p b{display:block;font-size:14px;color:var(--ink)}.gd .p span{display:block;font-size:12.5px;color:var(--mut);line-height:1.5;margin-top:2px}
.at{display:flex;flex-wrap:wrap;gap:16px;margin-top:20px}
.ac{flex:1 1 200px;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;text-decoration:none;color:inherit;transition:transform .25s,box-shadow .25s;animation:up .7s cubic-bezier(.2,.7,.2,1) backwards}
.ac:hover{transform:translateY(-5px);box-shadow:0 16px 34px rgba(81,0,187,.16)}
.ac i{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:700;transition:transform .25s}.ac:hover i{transform:translateX(4px)}
.ac b{display:block;font-size:14px;color:var(--ink)}.ac span{display:block;font-size:12px;color:var(--mut)}
.pie{margin-top:26px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px;font-size:12.5px;color:var(--mut);animation:up .7s cubic-bezier(.2,.7,.2,1) .9s backwards}.pie b{color:var(--v)}
@keyframes fl{50%{transform:translateY(-9px)}}
@property --p{syntax:'<number>';initial-value:1;inherits:false}
@keyframes pp{from{--p:0}to{--p:1}}
.cu{animation:pp 1.5s cubic-bezier(.2,.7,.2,1) .25s backwards;counter-reset:n calc(var(--p)*var(--to,0))}.cu:after{content:counter(n)}
@keyframes inl{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes gx{from{transform:scaleX(0)}}@keyframes gy{from{transform:scaleY(0)}}
@keyframes dn{from{stroke-dasharray:0 213.6}}
@keyframes pr{0%{box-shadow:0 0 0 0 rgba(224,36,94,.55)}100%{box-shadow:0 0 0 13px rgba(224,36,94,0)}}
@keyframes pg{0%{box-shadow:0 0 0 0 rgba(18,166,114,.55)}100%{box-shadow:0 0 0 11px rgba(18,166,114,0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="hero"><div class="nav"><a class="logo" href="index.html">ac<b>th</b>o</a><span><span style="font-size:13px;color:#D9C7FA;margin-right:18px">Sesión: <b id="usr" style="color:#fff"></b></span><span class="cg" id="cg" hidden></span><a class="s" href="#" onclick="salir();return false">Salir</a></span></div>
<div class="wrap t"><h1>Esto necesita tu <b>atención hoy</b></h1><p>Las alertas se calculan con los datos anonimizados de ACTHO al 21 nov 2026.</p></div></div>
<div class="wrap"><div class="m"><div class="pn"><div class="ph"><b>Para hoy</b><span><i></i>Actualizado 21 nov</span></div><div id="alertas"></div></div><div class="tl" id="tiles"></div></div><div class="ex" id="extra"></div></div>
<script>
const CARGOS={direccion:'Dirección',junta:'Junta Directiva',comercial:'Comercial',eventos:'Experiencias y eventos',contabilidad:'Contabilidad'};
const VR='#E0245E',AM='#FFB020',VE='#12A672',OR='#FF5500',MG='#CC3366',VI='#5100BB',CY='#00B8BF';
const f=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.'),sum=a=>a.reduce((x,y)=>x+y,0);
const cu=n=>`<span class="cu" style="--to:${n}"></span>`;
function dona(D){const t=D.n,r=34,c=2*Math.PI*r;let s=0,o='';[[D.rojo,VR],[D.amar,AM],[D.verde,VE]].forEach(([v,col])=>{o+=`<circle cx="40" cy="40" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-dasharray="${(v/t*c-1.5).toFixed(1)} ${c.toFixed(1)}" transform="rotate(${(s/t*360-90).toFixed(1)} 40 40)"></circle>`;s+=v});
return `<div class="dd"><svg width="74" height="74" viewBox="0 0 80 80" role="img" aria-label="Semáforo de riesgo">${o}</svg><div class="lg"><div><b style="background:${VR}"></b>${D.rojo} en rojo</div><div><b style="background:${AM}"></b>${D.amar} en amarillo</div><div><b style="background:${VE}"></b>${D.verde} en verde</div></div></div>`}
function barras(e,cols){const mx=Math.max(...e.map(x=>x[1]),1);return e.map(([k,v],i)=>`<div class="br"><span title="${k}">${k}</span><div><i style="width:${Math.max(v/mx*100,4).toFixed(0)}%;background:${cols[i%cols.length]};animation-delay:${(.45+i*.12).toFixed(2)}s"></i></div></div>`).join('')}
function columnas(VM){const ks=Object.keys(VM).filter(k=>k>='2026-09').sort().slice(0,12),mx=Math.max(...ks.map(k=>VM[k]),1);return `<div class="cl" role="img" aria-label="Membresías que vencen por mes">${ks.map((k,i)=>`<i style="height:${Math.max(VM[k]/mx*100,5).toFixed(0)}%;background:${k<'2026-11'?VR:k<='2026-12'?OR:VI};animation-delay:${(.45+i*.05).toFixed(2)}s"></i>`).join('')}</div>`}
function alerta(col,n,t,s,go,href,d,pulso){return `<a class="al" href="${href}" style="animation-delay:${d}s"><span class="dt${pulso?' r':''}" style="background:${col}"></span><span class="nm" style="color:${col}">${cu(n)}</span><span class="tx"><b>${t}</b><small>${s}</small></span><span class="go">${go} →</span></a>`}
function tile(href,t,d,vis,v,l,i){return `<a class="mt" href="${href}" style="animation-delay:${(.2+i*.1).toFixed(1)}s"><div class="h"><b>${t}</b><span>Abrir <i>→</i></span></div><div class="d">${d}</div><div class="v">${vis}</div><div class="s"><strong>${v}</strong><small>${l}</small></div></a>`}
guardia().then(async s=>{if(!s)return;
const[{data},{data:perm},{data:pf}]=await Promise.all([sb.from('tablero_datos').select('clave,datos'),sb.rpc('mis_tableros'),sb.from('perfiles').select('cargo').maybeSingle()]);
if(!data||!perm||!perm.length){await sb.auth.signOut();location.href='login.html?e=cargo';return}
if(pf&&CARGOS[pf.cargo]){const g=document.getElementById('cg');g.textContent='Cargo: '+CARGOS[pf.cargo];g.hidden=false}
const o={X:{}};data.forEach(r=>{if(/^X_/.test(r.clave))Object.assign(o.X,r.datos);else o[r.clave]=r.datos});const D=o.D&&o.D.Todos,X=o.X;if(!D)return;
const can=k=>perm.includes(k);let A='',i=0;const dl=()=>(0.2+(i++)*0.1).toFixed(1);
if(can('resumen'))A+=alerta(VR,D.rojo,'Empresas en semáforo rojo','Vencen en 90 días o menos y sin asistencia en 6 meses','Resumen','tablero.html?v=dir',dl(),true);
if(can('finanzas')){A+=alerta(AM,D.vpas,'Membresías ya vencidas','Renovación pendiente de las ejecutivas de cuenta','Finanzas','tablero.html?v=fin',dl(),false);
if(X.venm&&X.venm.Todos['2026-12'])A+=alerta(OR,X.venm.Todos['2026-12'],'Vencen en diciembre de 2026','El mayor pico de vencimientos del año','Finanzas','tablero.html?v=fin',dl(),false)}
if(can('comunicaciones')&&X.pe)A+=alerta(MG,X.pe.Todos.rec,'Personas recurrentes','Asistieron a 3 o más eventos: trato directo','Comunicaciones','tablero.html?v=com',dl(),false);
if(can('eventos')&&X.ev){const m=X.ev.reduce((a,e)=>e.t.Todos>a.t.Todos?e:a,X.ev[0]);A+=alerta(VI,m.t.Todos,'Evento con más inscritos',String(m.nom||'Evento 2026').slice(0,60),'Eventos','tablero.html?v=ev',dl(),false)}
document.getElementById('alertas').innerHTML=A;
let T='',j=0;
if(can('resumen'))T+=tile('tablero.html?v=dir','Resumen','Semáforo, vencimientos y empresas a contactar.',dona(D),f(D.n),'vigentes',j++);
if(can('eventos')&&X.lin)T+=tile('tablero.html?v=ev','Eventos','Inscripciones por línea y modalidad.',barras(Object.entries(X.lin.Todos).sort((a,b)=>b[1]-a[1]),[VI,OR,MG,CY]),X.ev?f(sum(X.ev.map(e=>e.t.Todos))):'',X.ev?'inscripciones en '+X.ev.length+' eventos':'',j++);
if(can('comunicaciones')&&X.enc&&X.pe)T+=tile('tablero.html?v=com','Comunicaciones','A quién escribir y sobre qué temas.',barras(Object.entries(X.enc.Todos.tem).sort((a,b)=>b[1]-a[1]).slice(0,4),[MG]),f(X.pe.Todos.per),'personas',j++);
if(can('finanzas')&&X.venm)T+=tile('tablero.html?v=fin','Finanzas','Vencimientos y renovaciones por mes.',columnas(X.venm.Todos),f(sum(Object.entries(X.venm.Todos).filter(([k])=>k>='2027-01').map(e=>e[1]))),'vencen en 2027',j++);
document.getElementById('tiles').innerHTML=T;
const kp=(n,l,sub,suf)=>`<div><strong>${n>=1000?f(n):cu(n)}${suf||''}</strong><b>${l}</b><small>${sub}</small></div>`;
let N='';
const nv=[];
if(X.ev)nv.push(kp(sum(X.ev.map(e=>e.t.Todos)),'Inscripciones','en '+X.ev.length+' eventos'));
if(can('comunicaciones')&&X.pe)nv.push(kp(X.pe.Todos.per,'Personas \u00fanicas','han asistido'));
if(can('comunicaciones')&&X.enc)nv.push(kp(Math.round(X.enc.Todos.si/X.enc.Todos.n*100),'Satisfechos','de '+X.enc.Todos.n+' respuestas','%'));
if(can('resumen'))nv.push(kp(D.n,'Afiliados vigentes','en la cartera'));
if(nv.length)N+=`<div class="bn"><h3>ACTHO EN CIFRAS</h3><div class="nn">${nv.join('')}</div></div>`;
if(can('resumen'))N+=`<div class="gd"><b>C\u00f3mo leer el sem\u00e1foro</b><div class="ps"><div class="p"><i style="background:${VR}"></i><div><b>Rojo</b><span>Vence en 90 d\u00edas o menos y sin asistencia en 6 meses: contactar primero.</span></div></div><div class="p"><i style="background:${AM}"></i><div><b>Amarillo</b><span>Una sola se\u00f1al de riesgo: dar seguimiento.</span></div></div><div class="p"><i style="background:${VE}"></i><div><b>Verde</b><span>Sin se\u00f1ales de riesgo: mantener la relaci\u00f3n.</span></div></div></div></div>`;
const at=(c,t,sb,h,d)=>`<a class="ac" href="${h}" style="animation-delay:${d}s"><i style="background:${c}">\u2192</i><span><b>${t}</b><span>${sb}</span></span></a>`;
let Q='',q=0;const dq=()=>(.7+(q++)*.08).toFixed(2);
if(can('resumen'))Q+=at(VR,'Empresas en rojo','Lista para contactar','tablero.html?v=dir',dq());
if(can('eventos')&&X.ev){const m=X.ev.reduce((a,e)=>e.t.Todos>a.t.Todos?e:a,X.ev[0]);Q+=at(VI,'Evento m\u00e1s grande',String(m.nom).slice(0,28)+' \u00b7 '+m.t.Todos,'tablero.html?v=ev',dq())}
if(can('comunicaciones')&&X.pe)Q+=at(MG,'Personas recurrentes',X.pe.Todos.rec+' con 3 o m\u00e1s eventos','tablero.html?v=com',dq());
if(can('finanzas'))Q+=at(OR,'Pendientes de renovar',D.vpas+' ya vencidas','tablero.html?v=fin',dq());
if(Q)N+=`<div class="at">${Q}</div>`;
N+=`<div class="pie"><span><b>Estud-IA \u00d7 ACTHO</b> \u00b7 Equipo PENTA DATA</span><span>Datos anonimizados \u00b7 corte 21 nov 2026</span></div>`;
document.getElementById('extra').innerHTML=N;
});
</script>
</body></html>
